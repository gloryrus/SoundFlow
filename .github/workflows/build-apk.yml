name: SoundFlow Auto Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
      - 'LICENSES/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soundflow-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed release APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package.outputs.version }}
      apk_name: ${{ steps.package.outputs.apk_name }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore private release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SOUNDFLOW_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, base64
          from pathlib import Path
          value = os.environ.get('KEYSTORE_BASE64', '').strip()
          if not value:
              raise SystemExit('Missing repository secret SOUNDFLOW_KEYSTORE_BASE64')
          key = Path(os.environ['RUNNER_TEMP']) / 'soundflow-release.jks'
          key.write_bytes(base64.b64decode(value, validate=True))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'SOUNDFLOW_KEYSTORE={key}\n')
          PY

      - name: Build signed release APK
        env:
          SOUNDFLOW_STORE_PASSWORD: ${{ secrets.SOUNDFLOW_STORE_PASSWORD }}
          SOUNDFLOW_KEY_ALIAS: ${{ secrets.SOUNDFLOW_KEY_ALIAS }}
          SOUNDFLOW_KEY_PASSWORD: ${{ secrets.SOUNDFLOW_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in SOUNDFLOW_STORE_PASSWORD SOUNDFLOW_KEY_ALIAS SOUNDFLOW_KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing repository secret: $variable"
              exit 1
            fi
          done
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache assembleRelease

      - name: Verify and name release APK
        id: package
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          test -f "$APK"
          "$TOOLS/apksigner" verify "$APK"
          BADGING=$("$TOOLS/aapt" dump badging "$APK")
          if grep -q '^application-debuggable' <<< "$BADGING"; then
            echo '::error::Refusing to publish a debuggable APK.'
            exit 1
          fi
          VERSION=$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING")
          if [[ ! "$VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo '::error::Invalid or missing APK versionName'
            exit 1
          fi
          NAME="SoundFlow-$VERSION.apk"
          mkdir -p dist
          cp "$APK" "dist/$NAME"
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "artifact_name=SoundFlow-$VERSION" >> "$GITHUB_OUTPUT"

      - name: Remove private keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/soundflow-release.jks"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            dist/${{ steps.package.outputs.apk_name }}
            dist/${{ steps.package.outputs.apk_name }}.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release automatically
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release

      - name: Create version tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.build.outputs.version }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          # Check the exact tag, not a similarly named branch. Never move existing tags.
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" --silent 2> "$RUNNER_TEMP/tag-error.txt"; then
            TAG_SHA=$(gh api "repos/$GH_REPO/commits/$TAG" --jq '.sha')
            if [[ "$TAG_SHA" != "$SOURCE_SHA" ]]; then
              echo "::error::$TAG already points to another commit. Increase versionName and versionCode in app/build.gradle; existing release/tag will not be overwritten."
              exit 1
            fi
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/tag-error.txt"; then
            cat "$RUNNER_TEMP/tag-error.txt" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            for FILE in "$APK_NAME" "$APK_NAME.sha256"; do
              if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$FILE"; then
                echo "Already published; left unchanged: $FILE"
              else
                gh release upload "$TAG" "release/$FILE"
              fi
            done
          else
            gh release create "$TAG" "release/$APK_NAME" "release/$APK_NAME.sha256" \
              --target "$SOURCE_SHA" --title "SoundFlow $VERSION" --generate-notes
          fi
